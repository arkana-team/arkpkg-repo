name: Publish arkpkg repository

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "data/package-metadata.json"
      - "scripts/build-index.py"
      - "scripts/test-build-index.py"
      - "scripts/test-package-index-tilde.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out package repository
        uses: actions/checkout@v6

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build package index and site files
        run: |
          python3 -m venv /tmp/arkpkg-repo-venv
          /tmp/arkpkg-repo-venv/bin/pip install --disable-pip-version-check lz4
          /tmp/arkpkg-repo-venv/bin/python scripts/test-package-index-tilde.py
          /tmp/arkpkg-repo-venv/bin/python scripts/test-build-index.py
          /tmp/arkpkg-repo-venv/bin/python scripts/build-index.py --site-dir site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

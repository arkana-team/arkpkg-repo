name: Package index tests

on:
  pull_request:
    paths:
      - "packages/**"
      - "data/debian-cli-packages.json"
      - "data/debian-cli-packages-batch-*.json"
      - "data/package-metadata.json"
      - "scripts/build-index.py"
      - "scripts/test-build-index.py"
      - "scripts/test-package-index-tilde.py"
      - "scripts/test-debian-cli-packages.py"
      - "scripts/build-motif-nedit.py"
      - "scripts/test-motif-nedit-sources.py"
      - ".github/workflows/package-index-tests.yml"
  push:
    paths:
      - "packages/**"
      - "data/debian-cli-packages.json"
      - "data/debian-cli-packages-batch-*.json"
      - "data/package-metadata.json"
      - "scripts/build-index.py"
      - "scripts/test-build-index.py"
      - "scripts/test-package-index-tilde.py"
      - "scripts/test-debian-cli-packages.py"
      - "scripts/build-motif-nedit.py"
      - "scripts/test-motif-nedit-sources.py"
      - ".github/workflows/package-index-tests.yml"

permissions:
  contents: read

jobs:
  package-index:
    name: Validate package index metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install index builder dependency
        run: python3 -m pip install lz4
      - name: Test epoch and tilde versions
        run: python3 scripts/test-package-index-tilde.py -v
      - name: Test pinned Debian package metadata
        run: python3 scripts/test-debian-cli-packages.py -v
      - name: Test Motif and NEdit source snapshots
        run: python3 scripts/test-motif-nedit-sources.py -v
      - name: Test package metadata and Pages generation
        run: python3 scripts/test-build-index.py -v
